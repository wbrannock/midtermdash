name: Refresh data

# Fetches market and election data, validates it, and pushes compact JSON
# snapshots to the `data` branch. Uses only the built-in GITHUB_TOKEN.
#
# Schedules run only from the default branch. GitHub may delay or drop
# scheduled runs under load (worst at the top of the hour), and disables
# schedules on public repos after 60 days without repository activity.

on:
  # Scheduled runs removed after the 2026 election (shut down 2026-11-05).
  # Previously: "3-58/5 * * * *" (election-night window) and "17 */2 * * *".
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full pipeline even outside the election-night window"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check out data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REMOTE" out-data
          else
            mkdir out-data && cd out-data && git init -b data && git remote add origin "$REMOTE"
            printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
            printf '# data branch\n\nGenerated by the refresh-data workflow. Do not edit by hand.\n' > README.md
          fi

      - name: Run pipeline
        env:
          # The 5-minute schedule is gated to the election-night window; the
          # 2-hourly schedule and manual runs are not.
          GATE: ${{ github.event.schedule == '3-58/5 * * * *' && '--gate' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: npx tsx pipeline/run.ts --data-dir out-data $GATE

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out-data
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then exit 0; fi
            echo "push failed (attempt $attempt); rebasing"
            git fetch origin data && git rebase -X theirs origin/data || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "push failed after retries" >&2; exit 1
